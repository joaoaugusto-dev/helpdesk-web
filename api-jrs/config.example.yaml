# JSON REST Server - ambiente didatico LOCAL
name: HelpDesk API
port: 5050
host: 127.0.0.1
database: database.json
idType: int
enableSocket: false

auth:
  jwtSecret: "SUBSTITUA_POR_CHAVE_ALEATORIA_LONGA_E_SECRETA"
  jwtExpire: 3600
  unauthorizedStatusCode: 403
  enableAdm: true
  # Mantemos o usuario comum apenas com consultas GET.
  # Liberar /tickets aqui concederia POST, PUT e DELETE juntos.
  urlUserPermission: []
  # Login em /auth ja e tratado automaticamente pelo JRS.
  urlSkip: []
